[package]
name = "kevro"
version = "0.1.0"
edition = "2024"
authors = ["Lenard0"]
license = "MIT"
description = "Keyboard-first window and app control for macOS: app hotkeys, window snapping and directional focus"
repository = "https://github.com/Lenard-0/Kevro"
homepage = "https://github.com/Lenard-0/Kevro"
readme = "README.md"
keywords = ["macos", "window-manager", "hotkeys", "tiling", "productivity"]
categories = ["command-line-utilities", "os::macos-apis"]

[dependencies]
global-hotkey = "0.10"
tao = "0.37"
tray-icon = "0.26"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-application-services = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
