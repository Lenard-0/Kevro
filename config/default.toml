# Kevro configuration
#
# Location: ~/.config/kevro/config.toml
# Kevro reloads this file automatically when it changes (and from the menu bar
# via "Reload config"). If the file has an error, Kevro keeps the previous
# bindings and logs the problem to ~/Library/Logs/kevro/kevro.log.
#
# Hotkey syntax: modifiers and a key joined with "+", case-insensitive.
#   Modifiers: ctrl (control), alt (option), cmd (command, super), shift
#   Keys:      a-z, 0-9, left, right, up, down, space, enter, tab, f1-f20,
#              and punctuation such as minus, equal, comma, period, slash
#
# Shortcuts to avoid (they belong to macOS or major apps):
#   ctrl+left/right/up/down    Spaces, Mission Control, App Exposé
#   cmd+alt+left/right         tab/editor switching in Chrome and VS Code
#   cmd+alt+w / v / c          close all windows, Finder move / copy path
#   ctrl+`                     VS Code terminal toggle

# Launch an app, or bring it to the front if it is already running.
# Values are bundle IDs (preferred) or app names such as "Safari".
# Find a bundle ID with:  osascript -e 'id of app "Visual Studio Code"'
[apps]
"ctrl+alt+cmd+v" = "com.microsoft.VSCode"
"ctrl+alt+cmd+c" = "com.google.Chrome"
"ctrl+alt+cmd+w" = "dev.warp.Warp-Stable"

# Move and resize the focused window. Needs Accessibility permission.
# Actions: left_half, right_half, top_half, bottom_half, maximize, center,
#          first_third, center_third, last_third, first_two_thirds,
#          last_two_thirds, restore
[snap]
"ctrl+alt+left"       = "left_half"
"ctrl+alt+right"      = "right_half"
"ctrl+alt+shift+up"   = "top_half"
"ctrl+alt+shift+down" = "bottom_half"
"ctrl+alt+up"         = "maximize"
"ctrl+alt+down"       = "restore"
"ctrl+alt+c"          = "center"
"ctrl+alt+d"          = "first_third"
"ctrl+alt+f"          = "center_third"
"ctrl+alt+g"          = "last_third"
"ctrl+alt+e"          = "first_two_thirds"
"ctrl+alt+t"          = "last_two_thirds"

# Focus the nearest window in a direction, across apps and displays.
# Needs Accessibility permission.
[focus]
"ctrl+alt+cmd+left"  = "focus_left"
"ctrl+alt+cmd+right" = "focus_right"
"ctrl+alt+cmd+up"    = "focus_up"
"ctrl+alt+cmd+down"  = "focus_down"

[options]
# Pressing left_half / right_half again on an already-snapped window cycles
# 1/2 -> 1/3 -> 2/3 of the screen.
cycle_halves_to_thirds = false
# Pixels between windows and the screen edges.
gap = 0
# Pressing an app hotkey when that app is already frontmost hides it.
hide_if_frontmost = false
